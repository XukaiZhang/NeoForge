<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoForge — Acceso Equipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="auth-gate">

    <div class="auth-bg-grid" aria-hidden="true"></div>
    <div class="auth-bg-glow agent-glow" aria-hidden="true"></div>

    <div class="auth-container auth-container--narrow">
        <div class="agent-login-card">

            <div class="agent-login-header">
                <div class="logo-mark-sm" style="width:42px;height:42px;font-size:0.9rem">NF</div>
                <div>
                    <div class="auth-portal-badge agent"><i class="bi bi-shield-lock-fill"></i> Acceso Equipo</div>
                    <h2 style="margin:6px 0 0;">Panel de agentes</h2>
                    <p class="form-subtitle">Solo para personal autorizado de NeoForge</p>
                </div>
            </div>

            <div id="status-msg-agente" class="status-alert" style="display:none;margin-bottom:12px;"></div>

            <button type="button" id="btnGoogleAgente" class="btn-google" style="margin-bottom:4px;">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continuar con Google
            </button>

            <div class="auth-divider"><span>o con email</span></div>

            <form id="agenteLoginForm" class="auth-form" novalidate style="gap:14px;">
                <div class="form-group">
                    <label for="agenteEmail">Correo corporativo</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                        <input type="email" id="agenteEmail" placeholder="agente@empresa.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="agentePassword">
                        Contraseña
                        <button type="button" class="forgot-link" id="btnForgotAgente">¿Olvidaste tu contraseña?</button>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="agentePassword" placeholder="••••••••••" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" id="toggleAgentePw" tabindex="-1">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-action agent-btn">
                    <i class="bi bi-box-arrow-in-right"></i>
                    Acceder al panel
                </button>
            </form>

            <div class="auth-portal-link" style="margin-top:20px;text-align:center;">
                ¿Eres empleado? <a href="login.html">Portal de empleados →</a>
            </div>

        </div>
    </div>

    <!-- Forgot password modal -->
    <div class="modal-overlay" id="forgotModalAgente" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Restablecer contraseña</h3>
                <button class="modal-close" id="closeForgotAgente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <p class="modal-desc">Introduce tu correo corporativo y te enviaremos un enlace de recuperación.</p>
            <div id="forgotStatusAgente" class="status-alert" style="display:none;"></div>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>
                <input type="email" id="forgotEmailAgente" placeholder="agente@empresa.com" autocomplete="email">
            </div>
            <button class="btn-primary-action agent-btn" id="btnSendResetAgente" style="margin-top:16px;">
                Enviar enlace
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>

    <script type="module" src="js/auth-agente.js"></script>
    <script>
        const btn = document.getElementById('toggleAgentePw'), inp = document.getElementById('agentePassword');
        btn?.addEventListener('click', () => { const show=inp.type==='password'; inp.type=show?'text':'password'; btn.style.color=show?'var(--accent-light)':''; });

        const modal = document.getElementById('forgotModalAgente');
        document.getElementById('btnForgotAgente')?.addEventListener('click',  () => modal.style.display='flex');
        document.getElementById('closeForgotAgente')?.addEventListener('click',() => modal.style.display='none');
        modal?.addEventListener('click', e => { if(e.target===modal) modal.style.display='none'; });
    </script>
</body>
</html>
