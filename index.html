<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoForge - Ticketing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg neoforge-navbar mb-4">
        <div class="container">
            <span class="navbar-brand font-monospace fw-bold text-primary">⚡ NeoForge // Ticketing</span>
        </div>
    </nav>

    <div class="container">
        <div class="row gap-4">
            <div class="col-md-4 card p-4 shadow-sm">
                <h4 class="mb-3">Nueva Incidencia</h4>
                <form id="ticketForm">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="departamento" class="form-label">Departamento</label>
                        <select class="form-select" id="departamento" required>
                            <option value="Ventas">Ventas</option>
                            <option value="Administración">Administración</option>
                            <option value="Operaciones">Operaciones</option>
                            <option value="Dirección">Dirección</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="prioridad" class="form-label">Prioridad</label>
                        <select class="form-select" id="prioridad" required>
                            <option value="Baja">Baja</option>
                            <option value="Media">Media</option>
                            <option value="Alta">Alta</option>
                            <option value="Crítica">Crítica</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear Ticket</button>
                </form>
            </div>

            <div class="col-md card p-4 shadow-sm table-responsive">
                <h4 class="mb-3">Tickets Activos</h4>
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Dpto.</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>SLA (Límite)</th>
                        </tr>
                    </thead>
                    <tbody id="ticketsBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
