<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoForge — Plataforma de Helpdesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0b0d14;
            color: #f0f0f3;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            top: -20%;
            left: 15%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(ellipse, rgba(99,102,241,0.13) 0%, transparent 65%);
            pointer-events: none;
        }
        .splash {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: splashIn 0.7s cubic-bezier(0.34,1.4,0.64,1) both;
        }
        @keyframes splashIn {
            from { opacity:0; transform:translateY(20px) scale(0.96); }
            to   { opacity:1; transform:translateY(0)    scale(1);    }
        }
        .splash.leaving {
            animation: splashOut 0.35s ease forwards;
        }
        @keyframes splashOut {
            from { opacity:1; transform:scale(1); }
            to   { opacity:0; transform:scale(0.95); }
        }
        .logo-mark {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            animation: logoPulse 2.2s ease-in-out infinite;
            box-shadow: 0 8px 32px rgba(99,102,241,0.35);
        }
        @keyframes logoPulse {
            0%,100% { box-shadow: 0 8px 32px rgba(99,102,241,0.35), 0 0 0 0 rgba(99,102,241,0.4); }
            50%      { box-shadow: 0 8px 32px rgba(99,102,241,0.35), 0 0 0 14px rgba(99,102,241,0); }
        }
        .brand-name {
            font-family: 'Syne', sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .brand-name span { color: #818cf8; }
        .brand-sub {
            font-size: 0.75rem;
            color: #555c70;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.05em;
        }
        .loader-track {
            width: 180px;
            height: 2px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        .loader-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #818cf8);
            border-radius: 4px;
            width: 0%;
            animation: loadFill 1.8s ease forwards;
        }
        @keyframes loadFill {
            0%   { width: 0%; }
            50%  { width: 70%; }
            90%  { width: 92%; }
            100% { width: 100%; }
        }
        .loader-status {
            font-size: 0.7rem;
            color: #555c70;
            font-family: 'DM Mono', monospace;
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <div class="logo-mark">NF</div>
        <div class="brand-name">Neo<span>Forge</span></div>
        <div class="brand-sub">HELPDESK Y GESTIÓN DE ACTIVOS</div>
        <div class="loader-track"><div class="loader-fill"></div></div>
        <div class="loader-status" id="loaderStatus">Iniciando…</div>
    </div>

    <script type="module">
        import { initializeApp }     from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const cfg = {
            apiKey:            "AIzaSyAqkVlGR2sPiNQykEYYbX5YgyFkZkXjiww",
            authDomain:        "neoforge-d06b7.firebaseapp.com",
            projectId:         "neoforge-d06b7",
            storageBucket:     "neoforge-d06b7.firebasestorage.app",
            messagingSenderId: "762899766435",
            appId:             "1:762899766435:web:a340e0e6cdd9711d603316"
        };

        const statusEl = document.getElementById('loaderStatus');
        const splash   = document.getElementById('splash');
        const msgs = ['Iniciando…','Conectando a Firebase…','Verificando sesión…'];
        let i = 0;
        const ticker = setInterval(() => { if (statusEl) statusEl.textContent = msgs[Math.min(++i, msgs.length-1)]; }, 500);

        function go(url) {
            clearInterval(ticker);
            if (statusEl) statusEl.textContent = 'Redirigiendo…';
            splash.classList.add('leaving');
            setTimeout(() => window.location.replace(url), 380);
        }

        try {
            const app  = initializeApp(cfg);
            const auth = getAuth(app);
            const { getFirestore, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
            const db = getFirestore(app);
            const fallback = setTimeout(() => go('login.html'), 3500);
            onAuthStateChanged(auth, async user => {
                clearTimeout(fallback);
                if (!user) { go('login.html'); return; }
                try {
                    const snap = await getDoc(doc(db, 'usuarios', user.uid));
                    const rol  = snap.exists() ? (snap.data().rol ?? 'cliente') : 'cliente';
                    go(rol === 'agente' || rol === 'admin' ? 'dashboard.html' : 'mis-tickets.html');
                } catch { go('login-agente.html'); }
            });
        } catch { go('login.html'); }
    </script>
</body>
</html>
