<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NeoForge // Inventario de Activos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/inventory.css">
</head>
<body class="viewport">
    <div class="layout-grid">
        <aside class="sidebar-v2">
            <div class="nav-top"><i class="bi bi-shield-check"></i> NeoForge</div>
            <nav class="v-nav">
                <a href="dashboard.html" class="v-link"><i class="bi bi-ticket-perforated"></i><span>Tickets</span></a>
                <a href="inventory.html" class="v-link active"><i class="bi bi-box-seam"></i><span>Inventario</span></a>
                <a href="analytics.html" class="v-link"><i class="bi bi-graph-up-arrow"></i><span>Analíticas</span></a>
            </nav>
            <div class="nav-bottom">
                <button id="btnLogout" class="power-off"><i class="bi bi-box-arrow-left"></i></button>
            </div>
        </aside>

        <main class="content-frame">
            <header class="top-meta"><h2>Control de Activos</h2></header>
            <div class="inventory-engine">
                <div class="panel-v3 p-4">
                    <form id="assetForm" class="row g-3">
                        <div class="col-md-3">
                            <label class="small fw-bold text-muted">S/N</label>
                            <input type="text" id="serial" class="n-input" placeholder="Número de Serie" required>
                        </div>
                        <div class="col-md-3">
                            <label class="small fw-bold text-muted">Modelo</label>
                            <input type="text" id="modelo" class="n-input" placeholder="Ej: MacBook Pro" required>
                        </div>
                        <div class="col-md-3">
                            <label class="small fw-bold text-muted">Categoría</label>
                            <select id="tipo" class="n-input">
                                <option value="Laptop">Laptop</option>
                                <option value="Mobile">Móvil</option>
                                <option value="Server">Servidor</option>
                                <option value="Network">Redes</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn-primary-custom w-100">Registrar Activo</button>
                        </div>
                    </form>
                </div>
                <div class="neo-table-container">
                    <table class="n-table">
                        <thead>
                            <tr>
                                <th>S/N</th>
                                <th>Modelo</th>
                                <th>Categoría</th>
                                <th>Estado Vida</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/inventory.js"></script>
</body>
</html>
