<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NeoForge // Panel de Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="viewport">
    <div class="layout-grid">
        <aside class="sidebar-v2">
            <div class="nav-top"><i class="bi bi-shield-check"></i> NeoForge</div>
            <nav class="v-nav">
                <a href="dashboard.html" class="v-link active"><i class="bi bi-ticket-perforated"></i><span>Tickets</span></a>
                <a href="inventory.html" class="v-link"><i class="bi bi-box-seam"></i><span>Inventario</span></a>
                <a href="analytics.html" class="v-link"><i class="bi bi-graph-up-arrow"></i><span>Analíticas</span></a>
            </nav>
            <div class="nav-bottom">
                <button id="btnLogout" class="power-off"><i class="bi bi-box-arrow-left"></i></button>
            </div>
        </aside>

        <main class="content-frame">
            <header class="top-meta">
                <h2>Gestión de Incidencias</h2>
                <div class="user-meta d-flex align-items-center gap-3">
                    <span id="userEmail" class="small fw-medium text-muted">---</span>
                </div>
            </header>

            <div class="dashboard-engine">
                <div class="form-side">
                    <div class="panel-header">Crear Nuevo Ticket</div>
                    <form id="ticketForm">
                        <div class="input-stack">
                            <label class="small fw-bold text-muted mb-1">Asunto</label>
                            <input type="text" id="titulo" placeholder="Ej: Error en servidor de correo" required>
                            
                            <label class="small fw-bold text-muted mb-1">Descripción</label>
                            <textarea id="descripcion" rows="4" placeholder="Describe el problema detalladamente..." required></textarea>
                            
                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="small fw-bold text-muted mb-1">Departamento</label>
                                    <select id="departamento">
                                        <option value="Soporte IT">Soporte IT</option>
                                        <option value="Desarrollo">Desarrollo</option>
                                        <option value="Mantenimiento">Mantenimiento</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="small fw-bold text-muted mb-1">Prioridad</label>
                                    <select id="prioridad">
                                        <option value="P3">Baja</option>
                                        <option value="P2">Media</option>
                                        <option value="P1">Alta</option>
                                        <option value="P0">Crítica</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary-custom w-100 mt-3">Enviar Ticket</button>
                    </form>
                </div>

                <div class="table-side">
                    <div class="table-filters">
                        <i class="bi bi-search text-muted"></i>
                        <input type="text" id="ticketSearch" placeholder="Buscar por ID o asunto...">
                        <div class="counter-box">Activos: <span id="ticketCount">0</span></div>
                    </div>
                    <div class="neo-table-container">
                        <table class="n-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Incidencia</th>
                                    <th>Prioridad</th>
                                    <th>Estado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="ticketsBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/tickets.js"></script>
</body>
</html>
