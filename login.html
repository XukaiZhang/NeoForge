<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoForge // Enterprise Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-gate">
    <div id="kernel-loader" class="loader-bar"></div>
    <section class="auth-wrapper">
        <div class="glass-card">
            <div class="auth-header">
                <h1>Neo<span>Forge</span></h1>
                <div class="security-string">Portal de Gestión de Incidencias</div>
            </div>
            <form id="loginForm">
                <div class="field-wrap">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" placeholder="nombre@empresa.com" required>
                </div>
                <div class="field-wrap">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div id="status-msg" class="terminal-msg"></div>
                <button type="submit" class="btn-glitch">Iniciar Sesión</button>
            </form>
            <div class="auth-nav">
                <button id="btnRegister" class="link-cmd">Solicitar acceso nuevo</button>
            </div>
        </div>
    </section>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
